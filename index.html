<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management System - v1.0.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Hệ Thống Quản Lý Người Dùng <span class="badge" id="version-tag">v1.0.0</span></h1>
      <p class="subtitle">Mô phỏng quy trình Gitflow & Hotfix thực tế</p>
    </header>

    <main class="card">
      <h2>Tra cứu thông tin người dùng</h2>
      <div class="input-group">
        <label for="userId">Chọn ID Người dùng:</label>
        <select id="userId">
          <option value="1">1 - Nguyen Van A</option>
          <option value="2">2 - Tran Thi B</option>
          <option value="3">3 - Le Van C</option>
        </select>
        <button id="btnFetch" onclick="handleFetchUser()">Xem thông tin</button>
      </div>

      <div class="result-box">
        <h3>Kết quả phản hồi (JSON):</h3>
        <pre id="output">Vui lòng bấm 'Xem thông tin' để tải dữ liệu...</pre>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
